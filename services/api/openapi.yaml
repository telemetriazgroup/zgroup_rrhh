openapi: 3.0.3
info:
  title: GaritaControl API
  version: 0.1.0
  description: |
    La interfaz envía aquí la foto del fotocheck o del DNI.
    Esta API consulta el contenedor de visión y coteja el DNI.
    No crea trabajadores ni marcaciones.
paths:
  /api/v1/auth/login:
    post:
      summary: Crear una sesión y devolver el token
      responses:
        "200":
          description: Token de sesión, vencimiento y usuario
        "401":
          description: Credenciales inválidas, sin revelar si la cuenta existe
  /api/v1/auth/logout:
    post:
      summary: Revocar el token Bearer
      responses:
        "200":
          description: Sesión revocada
  /health:
    get:
      summary: Comprueba API, base de datos y visión
      responses:
        "200":
          description: Dependencias disponibles
  /api/v1/identidad/capturas:
    post:
      summary: Capturar un documento y cotejar el DNI
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [tipoDocumento, imagen]
              properties:
                tipoDocumento:
                  type: string
                  enum: [fotocheck, dni]
                imagen:
                  type: string
                  format: binary
      responses:
        "200":
          description: Captura registrada y extracción evaluada
        "400":
          description: Falta la imagen o el tipo de documento
        "413":
          description: La imagen supera 8 MB
        "502":
          description: El contenedor de visión no respondió
